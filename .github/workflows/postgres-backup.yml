name: Encrypted PostgreSQL backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PGHOST: ${{ secrets.BACKUP_PGHOST }}
      PGPORT: ${{ secrets.BACKUP_PGPORT }}
      PGUSER: ${{ secrets.BACKUP_PGUSER }}
      PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
      BACKUP_DATABASES: ${{ vars.BACKUP_DATABASES }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Validate backup secrets
        shell: bash
        run: |
          for name in PGHOST PGUSER PGPASSWORD BACKUP_ENCRYPTION_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Required repository secret for $name is missing." >&2
              exit 1
            fi
          done

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Dump and encrypt databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kaarigar-dumps" backups
          database_list="${BACKUP_DATABASES:-kaarigar_auth,kaarigar_event,kaarigar_kaarigar,kaarigar_visitor}"
          IFS=',' read -r -a databases <<< "$database_list"

          for database in "${databases[@]}"; do
            database="$(echo "$database" | xargs)"
            if [[ ! "$database" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Invalid database name in BACKUP_DATABASES." >&2
              exit 1
            fi
            pg_dump --host="$PGHOST" --port="${PGPORT:-5432}" --username="$PGUSER" \
              --dbname="$database" --format=custom --no-owner \
              --file="$RUNNER_TEMP/kaarigar-dumps/$database.dump"
          done

          stamp="$(date -u +%Y%m%d-%H%M%S)"
          tar -czf "$RUNNER_TEMP/kaarigar-$stamp.tar.gz" -C "$RUNNER_TEMP/kaarigar-dumps" .
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --cipher-algo AES256 --symmetric \
            --output "backups/kaarigar-$stamp.tar.gz.gpg" "$RUNNER_TEMP/kaarigar-$stamp.tar.gz"
          chmod 600 backups/kaarigar-*.gpg

      - name: Retain encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: kaarigar-postgres-backup-${{ github.run_id }}
          path: backups/*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
