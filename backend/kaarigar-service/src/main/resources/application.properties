spring.application.name=KAARIGAR-SERVICE
server.port=8083
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/kaarigar_artisan
spring.datasource.username=postgres
spring.datasource.password=admin

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

internal.service.secret=KaarigarExpoInternalSecret2026
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
media.storage-dir=uploads
media.storage=${MEDIA_STORAGE:database}
media.s3.bucket=${S3_BUCKET:}
media.s3.region=${S3_REGION:us-east-1}
media.s3.endpoint=${S3_ENDPOINT:}
media.s3.access-key=${S3_ACCESS_KEY:}
media.s3.secret-key=${S3_SECRET_KEY:}
