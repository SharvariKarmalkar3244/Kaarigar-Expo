spring.application.name=API-GATEWAY

server.port=8080


# =========================================================
# AUTH SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**


# =========================================================
# EVENT SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/events/**


# =========================================================
# KAARIGAR SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[2].id=kaarigar-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://KAARIGAR-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/kaarigars/**


# =========================================================
# VISITOR SERVICE ROUTE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[3].id=visitor-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://VISITOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/visitors/**


# =========================================================
# ADMIN APPLICATIONS ROUTE
# =========================================================

spring.cloud.gateway.server.webmvc.routes[4].id=admin-applications
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://KAARIGAR-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/admin/**


# =========================================================
# CORS CONFIGURATION
# =========================================================

spring.cloud.gateway.server.webmvc.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders[0]=*


# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


